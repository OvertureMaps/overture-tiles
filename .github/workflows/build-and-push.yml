# Build and Push Docker Image
# Triggered on GitHub release publish. Builds a Linux ARM64 Docker image,
# generates SLSA provenance and SBOM attestations, and pushes to GitHub Container Registry (ghcr.io).
#
# Verify attestations after release:
#   gh attestation verify oci://ghcr.io/ORG/REPO:TAG --owner ORG

name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-22.04-arm

    permissions:
      contents: read
      packages: write      # required to push to GitHub Container Registry
      id-token: write      # required for OIDC signing by attest-build-provenance
      attestations: write  # required to persist attestation to GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        id: version
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
          TAG_NAME="${GITHUB_EVENT_RELEASE_TAG_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Set lowercase repository
        id: lowercase
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: mode=max  # SLSA provenance attestation manifest stored in registry
          sbom: true            # SPDX SBOM attestation manifest stored in registry
          build-args: |
            TILES_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.repository }}:latest
            ghcr.io/${{ steps.lowercase.outputs.repository }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 #v4.1.0
        with:
          subject-name: ghcr.io/${{ steps.lowercase.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
