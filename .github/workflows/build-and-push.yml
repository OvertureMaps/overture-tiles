# Build and Push Docker Image
# Triggered on GitHub release publish. Builds a Linux ARM64 Docker image,
# generates SLSA provenance and SBOM attestations, and pushes to GitHub Container Registry (ghcr.io).
#
# Verify attestations after release:
#   gh attestation verify oci://ghcr.io/ORG/REPO:TAG --owner ORG

name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-22.04-arm

    permissions:
      contents: read
      packages: write      # required to push to GitHub Container Registry
      id-token: write      # required for OIDC signing by attest-build-provenance
      attestations: write  # required to persist attestation to GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        id: version
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
          TAG_NAME="${GITHUB_EVENT_RELEASE_TAG_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Set lowercase repository
        id: lowercase
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: mode=max  # SLSA provenance attestation manifest stored in registry
          sbom: true            # SPDX SBOM attestation manifest stored in registry
          build-args: |
            TILES_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.repository }}:latest
            ghcr.io/${{ steps.lowercase.outputs.repository }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 #v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.lowercase.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
